name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Deploy only from a push to main; pull requests build as a check and stop.
  IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the site
        run: |
          set -e
          test -f "index.html" || { echo "missing index.html"; exit 1; }
          echo "static checks complete"

      - uses: actions/configure-pages@v5
        if: env.IS_RELEASE == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: env.IS_RELEASE == 'true'
        with:
          path: .

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
