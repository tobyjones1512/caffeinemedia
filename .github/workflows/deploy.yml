name: Deploy

# The site is plain HTML/CSS/JS — there is nothing to build. This copies the
# files to GitHub Pages exactly as they sit in the repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs on every push and pull request. Deliberately has no `environment:` —
  # that is restricted to the default branch, and a job-level environment is
  # resolved before any step runs, so putting it here fails the whole job on
  # pull requests before a runner is even assigned.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          tar -cf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./_site' \
            --exclude='./README.md' \
            . | tar -xf - -C _site

      - name: Check the pages are all there
        run: |
          set -e
          for f in \
            _site/index.html \
            _site/about.html \
            _site/studios.html \
            _site/post.html \
            _site/films.html \
            _site/contact.html \
            _site/404.html \
            _site/css/styles.css \
            _site/css/fonts.css \
            _site/js/main.js \
            _site/favicon.svg \
            _site/sitemap.xml \
            _site/robots.txt \
            _site/CNAME \
            _site/.nojekyll
          do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          test -n "$(ls _site/fonts/*.woff2)" || { echo "no fonts staged"; exit 1; }
          echo "all pages and assets present"

      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
