name: Deploy

# The site is plain HTML/CSS/JS — there is nothing to build. This copies the
# files to GitHub Pages exactly as they sit in the repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'README.md' \
            ./ _site/

      - name: Check the pages are all there
        run: |
          set -e
          for f in \
            _site/index.html \
            _site/about.html \
            _site/studios.html \
            _site/post.html \
            _site/films.html \
            _site/contact.html \
            _site/404.html \
            _site/css/styles.css \
            _site/js/main.js \
            _site/favicon.svg \
            _site/sitemap.xml \
            _site/robots.txt \
            _site/CNAME \
            _site/.nojekyll
          do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "all pages and assets present"

      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - id: deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
